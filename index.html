<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Expense Tracker</title>
  <meta name="description" content="Personal expense tracker — offline, all data stays on your device.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">

  <!-- iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-transactions"></section>
    <section class="view" id="view-accounts"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <button class="fab-corner" id="fab" aria-label="Add transaction">+</button>

  <nav class="tabbar">
    <button data-tab="dashboard" class="active">
      <span class="ticon">🏠</span><span>Home</span>
    </button>
    <button data-tab="stats">
      <span class="ticon">📊</span><span>Stats</span>
    </button>
    <button data-tab="transactions">
      <span class="ticon">🧾</span><span>Activity</span>
    </button>
    <button data-tab="accounts">
      <span class="ticon">🏦</span><span>Accounts</span>
    </button>
    <button data-tab="settings">
      <span class="ticon">⚙️</span><span>Settings</span>
    </button>
  </nav>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
