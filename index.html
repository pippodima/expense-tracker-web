<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Expense Tracker</title>
  <meta name="description" content="Personal expense tracker — offline, all data stays on your device.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">

  <!-- iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-transactions"></section>
    <section class="view" id="view-accounts"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <button class="fab-corner" id="fab" aria-label="Add transaction">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Monochrome line icons: consistent weight, no emoji rendering differences -->
  <nav class="tabbar">
    <button data-tab="dashboard" class="active">
      <svg class="ticon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20h14V9.8"/>
      </svg><span>Home</span>
    </button>
    <button data-tab="stats">
      <svg class="ticon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 20V10M12 20V4M19 20v-6"/>
      </svg><span>Stats</span>
    </button>
    <button data-tab="transactions">
      <svg class="ticon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg><span>Activity</span>
    </button>
    <button data-tab="accounts">
      <svg class="ticon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9.5 12 4l9 5.5"/><path d="M5 10v9h14v-9"/><path d="M9 19v-5h6v5"/>
      </svg><span>Accounts</span>
    </button>
    <button data-tab="settings">
      <svg class="ticon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
      </svg><span>Settings</span>
    </button>
  </nav>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/detect.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
